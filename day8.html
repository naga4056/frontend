<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        .container1{
          display: flex;
          flex-direction: row;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: aqua;
            margin: 10px;
        }
        .container2{
            display: flex;
            flex-direction: column;
        }
        .box1{
            background-color: black;
            width: 50px;
            height: 50px;
            margin: 10px;
        }
        .container3{
            display: flex;
            flex-wrap: wrap ;
        }
        .box2{
           background-color: beige;
            width:50px ;
            height: 50px;
            margin: 10px;
        }
        .container4{
            flex-direction: row;
            display: flex;
            justify-content: space-between;
        }
        .box3{
          width: 50px;
          height: 50px;
          margin: 10px;
          background-color: blueviolet;
        }
        .container5{
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .box4{
            width: 40px;
            height: 40px;
            background-color: chocolate;
            margin-top: 10px;
        }
        .box5{
            width: 60px;
            height: 60px;
            background-color: darkslategrey;
            margin-top: 5px;
        }
        .box6{
            width: 70px;
            height: 70px;
            background-color: deeppink;
            margin-top: 6px;
        }
        .button{
            visibility:hidden;
        }
        .b{
            color: darkgreen;
            background-color: lightgray;
            text-decoration:black;
        }

    </style>
</head>
<body>
    <h1>rows</h1>
    <div class="container1">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <h1>cloums</h1>
    <div class="container2">
        <div class="box1"></div>
        <div class="box1"></div>
        <div class="box1"></div>
    </div>
     <h1>wrap</h1>
     <div class="container3">
        <div class="box2"></div>
        <div class="box2"></div>
        <div class="box2"></div>
     </div>
     <h1>space between</h1>
     <div class="container4">
        <div class="box3"></div>
        <div class="box3"></div>
        <div class="box3"></div>
     </div>
     <h1>different types to access methods</h1>
     <div class="container5">
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
     </div>
     <h1>hide button</h1>
     <div class="button">clik me</div>
     <h1>inline methods</h1>
     <div style="color: bisque;background-color: blue;width: 100px;height: 50px; padding-top: 20px;text-align: center;">have a greate day</div>
     <h1>span methods</h1>
     <span class="b">Nagaraj</span>
     <span class="b">Raja</span>
</body>
</html>
